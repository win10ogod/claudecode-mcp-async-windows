name: Test and Build

on:
  push:
    branches: [ main, master, develop, "claude/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Display Python version
      run: python --version

    - name: Display uv version
      run: uv --version

    - name: Build package with uv
      run: uv build

    - name: Install package
      run: |
        uv pip install dist/*.whl --system
      shell: bash

    - name: Test import
      run: python -c "import claudecode_mcp_async_server; print('Import successful')"

    - name: Test CLI entry point
      run: |
        claudecode-mcp-async --help || echo "CLI test completed"
      shell: bash

    - name: Upload build artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 7

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dev dependencies
      run: |
        uv pip install --system flake8 black isort

    - name: Check formatting with black
      run: black --check --diff claudecode_mcp_async_server.py
      continue-on-error: true

    - name: Check imports with isort
      run: isort --check-only --diff claudecode_mcp_async_server.py
      continue-on-error: true

    - name: Lint with flake8
      run: flake8 claudecode_mcp_async_server.py --max-line-length=120 --extend-ignore=E203,W503
      continue-on-error: true
